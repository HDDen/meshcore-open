name: Linux AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            flutter_arch: x64
            docker_platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            flutter_arch: arm64
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read AppImage pins
        id: pins
        run: |
          echo "version=$(jq -er '.flutter.version' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er '.flutter.source_revision' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
          echo "ubuntu=$(jq -er '.ubuntu' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter x64
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.version }}
          cache: true
      - name: Set up native Flutter ARM64
        if: matrix.arch == 'aarch64'
        uses: subosito/flutter-action@v2
        with:
          channel: main
          flutter-version: ${{ steps.pins.outputs.revision }}
          architecture: arm64
          git-source: https://github.com/flutter/flutter.git
          cache: true
      - name: Verify SDK and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          FLUTTER_VERSION: ${{ steps.pins.outputs.version }}
          FLUTTER_REVISION: ${{ steps.pins.outputs.revision }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p build
          flutter --version --machine > build/appimage-flutter.json
          jq -e --arg version "$FLUTTER_VERSION" --arg revision "$FLUTTER_REVISION" \
            '.frameworkVersion == $version and .frameworkRevision == $revision' build/appimage-flutter.json
      - name: Install Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            librsvg2-dev libgirepository1.0-dev libgtk-3-bin libgdk-pixbuf2.0-bin \
            libgdk-pixbuf-2.0-dev dpkg-dev patchelf file desktop-file-utils xdg-user-dirs \
            shellcheck libssl-dev libunwind-dev libvulkan-dev libgl1-mesa-dev \
            libasound2-dev libsecret-1-dev libgpg-error0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mco-advanced/appimage
          key: appimage-${{ matrix.arch }}-${{ hashFiles('scripts/appimage-tools.json') }}
      - name: Verify packaging contracts
        run: |
          shellcheck scripts/build_appimage.sh scripts/appimage/*.sh scripts/appimage/AppRun
          bash scripts/appimage/test_packaging.sh
      - run: flutter pub get
      - name: Build AppImage
        env:
          MESHCORE_BUILD_APPIMAGE: '1'
        run: flutter build linux --release --no-pub
      - uses: docker/setup-buildx-action@v3
      - name: Prepare clean Ubuntu runtime
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/appimage/Dockerfile
          target: runtime-test
          platforms: ${{ matrix.docker_platform }}
          build-args: BASE_IMAGE=${{ steps.pins.outputs.ubuntu }}
          tags: mco-appimage-runtime:ci
          cache-from: type=gha,scope=appimage-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=appimage-runtime-${{ matrix.arch }}
          load: true
      - name: Test AppImage in clean Ubuntu
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
          FLUTTER_ARCH: ${{ matrix.flutter_arch }}
        run: |
          mkdir -p build/appimage-runtime
          artifact="$PWD/build/linux/$FLUTTER_ARCH/release/mco-advanced-$APPIMAGE_ARCH.AppImage"
          docker run --rm --network none --stop-timeout 15 --user "$(id -u):$(id -g)" \
            --env MCO_APPIMAGE_EXPECT_ONNX=1 \
            --mount "type=bind,source=$artifact,target=/artifact.AppImage,readonly" \
            --mount "type=bind,source=$PWD/scripts/appimage/test_runtime.sh,target=/test_runtime.sh,readonly" \
            --mount "type=bind,source=$PWD/scripts/appimage/dependencies.sh,target=/dependencies.sh,readonly" \
            --mount "type=bind,source=$PWD/build/appimage-runtime,target=/results" \
            mco-appimage-runtime:ci timeout --signal=TERM --kill-after=15s 300s \
            xvfb-run -a bash /test_runtime.sh /artifact.AppImage /results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}-appimage
          path: |
            build/linux/${{ matrix.flutter_arch }}/release/*.AppImage
            build/linux/${{ matrix.flutter_arch }}/release/appimage-audit.txt
            build/linux/${{ matrix.flutter_arch }}/release/appimage-tools.json
            build/appimage-flutter.json
            build/appimage-runtime/
          if-no-files-found: warn
